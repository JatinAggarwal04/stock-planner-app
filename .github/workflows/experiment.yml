name: Model experiments

# Runs the walk-forward comparison of model variants (scripts/experiment.py).
# Push to an experiment/* branch, or run manually from the Actions tab.
on:
  push:
    branches: ["experiment/**"]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/experiment.py
